name: Deploy to Cloudflare Pages

on:
  push:
    branches: [claude/serene-faraday-d43p27]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnose Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Token length: ${#CF_TOKEN}  (expected ~40)"
          echo "Account ID length: ${#CF_ACCOUNT}  (expected 32)"
          echo "--- token verify ---"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN" | jq '{success, errors, status: .result.status}'
          echo "--- accounts visible to token ---"
          curl -s https://api.cloudflare.com/client/v4/accounts \
            -H "Authorization: Bearer $CF_TOKEN" | jq '{success, errors, accounts: [.result[]? | {id, name}]}'
          echo "--- pages projects in CF_ACCOUNT ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '{success, errors, projects: [.result[]? | .name]}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name tomgoodwin-london
