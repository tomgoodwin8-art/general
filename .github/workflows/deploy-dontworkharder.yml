name: Deploy dontworkharder to Cloudflare Pages

on:
  push:
    branches: [claude/wizardly-heisenberg-px7ijg]
    paths:
      - 'dontworkharder/**'
      - '.github/workflows/deploy-dontworkharder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-dontworkharder-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dontworkharder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dontworkharder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 96098d56f536b775de92b1652b183fed
          workingDirectory: dontworkharder
          command: pages project create dontworkharder --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 96098d56f536b775de92b1652b183fed
          workingDirectory: dontworkharder
          command: pages deploy dist --project-name dontworkharder --branch=main --commit-dirty=true
