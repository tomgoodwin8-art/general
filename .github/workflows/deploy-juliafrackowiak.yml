name: Deploy juliafrackowiak.com

on:
  push:
    branches: [claude/build-deploy-cloudflare-9o5mnj]
    paths:
      - 'sites/juliafrackowiak.com/**'
      - '.github/workflows/deploy-juliafrackowiak.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-juliafrackowiak-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sites/juliafrackowiak.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/juliafrackowiak.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites/juliafrackowiak.com
          command: pages project create juliafrackowiak-com --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites/juliafrackowiak.com
          command: pages deploy dist --project-name juliafrackowiak-com --branch=main --commit-dirty=true
