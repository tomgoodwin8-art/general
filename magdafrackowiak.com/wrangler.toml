# Cloudflare Workers project (static assets). Serves the built Astro output.
# Deploy: npm run build && npx wrangler deploy   (needs `wrangler login` or
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in the environment).
name = "magdafrackowiak-com"
compatibility_date = "2025-09-01"

# Custom domain. On deploy, wrangler binds the Worker to the apex domain and
# provisions its TLS certificate. Requires magdafrackowiak.com to be an active
# zone in this Cloudflare account (nameservers pointed at Cloudflare).
routes = [
  { pattern = "magdafrackowiak.com", custom_domain = true },
]

[assets]
directory = "./dist"
# Static site: honours public/_headers, returns a plain 404 for unknown paths.
not_found_handling = "none"
