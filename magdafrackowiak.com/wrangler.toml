# Cloudflare Workers project (static assets). Serves the built Astro output.
# Deploy: npm run build && npx wrangler deploy   (needs `wrangler login` or
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in the environment).
name = "magdafrackowiak-com"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
# Static site: honours public/_headers, returns a plain 404 for unknown paths.
not_found_handling = "none"
