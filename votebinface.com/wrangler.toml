# Cloudflare Pages / Workers static assets project for votebinface.com.
# Deploy: npm run build && npx wrangler deploy
# (needs `wrangler login` or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
name = "votebinface-com"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
# Static site: honours public/_headers, returns a real 404 for unknown paths.
not_found_handling = "404-page"
